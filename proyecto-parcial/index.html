<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#353839">
  <meta name="description" content="Acceso al sistema de compras y catálogo.">
  <title>Iniciar sesión · Casa Nua</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">
  <main class="auth-layout">
    <section class="auth-card" aria-labelledby="loginTitle">
      <header class="auth-head">
        <div class="auth-mark"><span class="mark-dot" aria-hidden="true"></span><span>Casa Nua</span></div>
        <h1 id="loginTitle">Accede a tu cuenta</h1>
        <p>Introduce tus credenciales para continuar.</p>
      </header>
      <div class="auth-body">
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input class="input" id="email" name="email" type="email" autocomplete="username" maxlength="120" spellcheck="false" placeholder="nombre@dominio.com…" required>
            <div class="error" data-error-for="email" aria-live="polite"></div>
          </div>
          <div class="field mt-2">
            <label for="password">Contraseña</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Tu contraseña…" required>
            <div class="error" data-error-for="password" aria-live="polite"></div>
          </div>
          <button class="btn mt-2" type="submit">Iniciar sesión</button>
          <div class="auth-footer">¿No tienes cuenta? <a href="register.html">Regístrate</a></div>
        </form>
        <p class="helper center mt-2">Demo administrador: admin@tienda.local · Admin123!</p>
      </div>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
