<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#15110e"><title>Mi perfil · Casa Nua</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Lato:wght@400;700&family=Cormorant+Garamond:wght@500;600&display=swap"><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="profile">
  <div class="app-shell"><div data-shell></div><main id="main-content" class="page-wrap">
    <section class="page-intro"><div><span class="eyebrow">Cliente</span><h1>Mi perfil</h1><p>Consulta y actualiza los datos asociados a tu cuenta.</p></div><div class="intro-accent" id="profileHint">Completa tu información para habilitar las compras.</div></section>
    <section class="panel"><div class="panel-head"><div><h2>Información personal</h2><p class="helper mb-0">Tus datos quedan asociados al usuario autenticado.</p></div></div>
      <div class="panel-body"><form id="profileForm"><div class="form-grid">
        <div class="field"><label for="nombre">Nombre</label><input class="input" id="nombre" name="nombre" type="text" autocomplete="given-name" minlength="2" maxlength="60"><div class="error" data-error-for="nombre" aria-live="polite"></div></div>
        <div class="field"><label for="apellido">Apellido</label><input class="input" id="apellido" name="apellido" type="text" autocomplete="family-name" minlength="2" maxlength="60"><div class="error" data-error-for="apellido" aria-live="polite"></div></div>
        <div class="field full"><label for="correo">Correo electrónico</label><input class="input" id="correo" name="correo" type="email" autocomplete="email" maxlength="120" spellcheck="false"><div class="error" data-error-for="correo" aria-live="polite"></div></div>
      </div><p class="helper mt-2" id="profileDate"></p><div class="actions mt-2"><button class="btn" type="submit">Guardar cambios</button><a class="btn secondary" href="dashboard.html">Cancelar</a></div></form></div>
    </section>
  </main></div><script type="module" src="js/app.js"></script>
</body></html>
