<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#353839"><title>Comprar · Casa Nua</title><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="purchase"><div class="app-shell"><div data-shell></div><main id="main-content" class="page-wrap">
