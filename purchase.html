<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#15110e"><title>Comprar · Casa Nua</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Lato:wght@400;700&family=Cormorant+Garamond:wght@500;600&display=swap"><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="purchase"><div class="app-shell"><div data-shell></div><main id="main-content" class="page-wrap">
  <section class="page-intro"><div><span class="eyebrow">Compra</span><h1>Elige tus productos</h1><p>Cada edición indica cuántos ejemplares quedan en la casa; puedes llevar hasta ese número.</p></div><div class="intro-accent">Al confirmar, apartamos tus ejemplares y el inventario se actualiza al instante.</div></section>
  <div class="purchase-layout">
    <section><div id="catalog" class="product-grid"></div></section>
    <aside class="panel cart"><div class="panel-head"><div><h2>Tu compra</h2><p class="helper mb-0" id="cartCount">0 unidades</p></div></div><div class="panel-body"><div id="cartList" class="cart-list"></div><div class="cart-total"><span>Total</span><strong id="cartTotal">$0</strong></div><div class="actions mt-2"><button class="btn" id="confirmPurchase" type="button" disabled>Confirmar compra</button><button class="btn secondary" id="clearCart" type="button">Vaciar</button></div></div></aside>
  </div>
</main></div><script type="module" src="js/app.js"></script></body></html>
