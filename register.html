<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15110e">
  <title>Crear cuenta · Casa Nua</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Lato:wght@400;700&family=Cormorant+Garamond:wght@500;600&display=swap"><link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="register">
  <main class="auth-layout">
    <div class="auth-scene" aria-label="Registro de cuenta">
      <div class="auth-topbar">
        <div class="auth-brand">
          <span class="auth-brand-mark" aria-hidden="true"></span>
          <span>Casa Nua</span>
        </div>
      </div>

      <section class="auth-card" aria-labelledby="registerTitle">
        <div class="auth-hero auth-hero-register">
          <div class="auth-copy">
            <div class="auth-copy-badge">Únete</div>
            <h1 id="registerTitle">Crear cuenta</h1>
            <p>Tu próxima compra empieza aquí.</p>
            <span>Completa tus datos y forma parte de Casa Nua.</span>
            <div class="auth-copy-tag">Biblioteca &amp; novedades editoriales</div>
          </div>

          <div class="auth-form-wrap auth-form-wrap-register">
            <div class="auth-form-box auth-form-box-register">
              <h2>Registro</h2>
              <form id="registerForm" novalidate>
                <div class="form-grid auth-register-grid">
                  <div class="field">
                    <label for="nombre">Nombre</label>
                    <input class="input" id="nombre" name="nombre" type="text" autocomplete="given-name" minlength="2" maxlength="60" placeholder="Tu nombre" required>
                    <div class="error" data-error-for="nombre" aria-live="polite"></div>
                  </div>
                  <div class="field">
                    <label for="apellido">Apellido</label>
                    <input class="input" id="apellido" name="apellido" type="text" autocomplete="family-name" minlength="2" maxlength="60" placeholder="Tu apellido" required>
                    <div class="error" data-error-for="apellido" aria-live="polite"></div>
                  </div>
                  <div class="field full">
                    <label for="email">Correo electrónico</label>
                    <input class="input" id="email" name="email" type="email" autocomplete="email" maxlength="120" spellcheck="false" placeholder="nombre@dominio.com" required>
                    <div class="error" data-error-for="email" aria-live="polite"></div>
                  </div>
                  <div class="field">
                    <label for="password">Contraseña</label>
                    <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Mínimo 8 caracteres" required>
                    <div class="error" data-error-for="password" aria-live="polite"></div>
                  </div>
                  <div class="field">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Repite tu contraseña" required>
                    <div class="error" data-error-for="confirmPassword" aria-live="polite"></div>
                  </div>
                </div>
                <div id="registerStatus" class="success-msg mt-2" tabindex="-1" aria-live="polite"></div>
                <button class="btn mt-2 auth-btn" type="submit">Registrarse</button>
                <div class="auth-footer">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
